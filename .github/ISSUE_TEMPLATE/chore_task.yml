name: Chore task
description: 整備/作業タスク用テンプレート（今回のようなchore）
title: '[ISxxx] Chore: <タイトル>'
labels: ['chore', 'priority:Should']
body:
  - type: input
    id: issue_id
    attributes:
      label: Issue ID
      description: IS番号（例 IS001）
      placeholder: IS001
    validations:
      required: true
  - type: input
    id: epic_id
    attributes:
      label: Epic ID
      description: Epic番号（例 EP01）
      placeholder: EP01
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: タスクの目的や背景
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 詳細タスク
      description: 実施内容を箇条書きで
      placeholder: |
        - ルール定義
        - テンプレ追加
        - CI設定
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 完了の定義
      placeholder: |
        - READMEにルールが明記されている
        - CIがPRで動作する
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - Must
        - Should
        - Could
      default: 2
    validations:
      required: true
  - type: checkboxes
    id: phase
    attributes:
      label: 想定フェーズ
      options:
        - label: Design
        - label: Implementation
        - label: Test
        - label: Release
